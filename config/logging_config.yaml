# Logging Configuration for Client Activation Engine

version: 1
disable_existing_loggers: false

# Log Formatters
formatters:
  standard:
    format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"
    
  detailed:
    format: "%(asctime)s - %(name)s - %(levelname)s - %(funcName)s:%(lineno)d - %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"
    
  json:
    format: '{"timestamp": "%(asctime)s", "logger": "%(name)s", "level": "%(levelname)s", "function": "%(funcName)s", "line": %(lineno)d, "message": "%(message)s"}'
    datefmt: "%Y-%m-%dT%H:%M:%S"

# Log Handlers
handlers:
  # Console Output
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: standard
    stream: ext://sys.stdout
    
  # Main Application Log
  app_file:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: detailed
    filename: logs/client_activation.log
    maxBytes: 10485760  # 10MB
    backupCount: 5
    
  # Error-specific Log
  error_file:
    class: logging.handlers.RotatingFileHandler
    level: ERROR
    formatter: detailed
    filename: logs/errors.log
    maxBytes: 5242880   # 5MB
    backupCount: 3
    
  # Orchestrator-specific Log
  orchestrator_file:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: json
    filename: logs/orchestrator.log
    maxBytes: 10485760  # 10MB
    backupCount: 5
    
  # Sandbox Execution Log
  sandbox_file:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: detailed
    filename: logs/sandbox_execution.log
    maxBytes: 5242880   # 5MB
    backupCount: 3
    
  # Performance Monitoring Log
  performance_file:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: json
    filename: logs/performance.log
    maxBytes: 10485760  # 10MB
    backupCount: 5

# Logger Configuration
loggers:
  # Root Logger
  root:
    level: INFO
    handlers: [console, app_file, error_file]
    
  # Core Components
  client_activation.core:
    level: DEBUG
    handlers: [app_file]
    propagate: false
    
  client_activation.orchestrator:
    level: DEBUG
    handlers: [orchestrator_file, console]
    propagate: false
    
  client_activation.sandbox:
    level: DEBUG
    handlers: [sandbox_file]
    propagate: false
    
  # MCP Tools
  client_activation.mcp_tools:
    level: DEBUG
    handlers: [app_file]
    propagate: false
    
  # LLM Components
  client_activation.llm:
    level: INFO
    handlers: [app_file]
    propagate: false
    
  # Performance Monitoring
  performance:
    level: INFO
    handlers: [performance_file]
    propagate: false
    
  # Third-party Libraries
  openai:
    level: WARNING
    handlers: [app_file]
    propagate: false
    
  pydantic:
    level: WARNING
    handlers: [app_file]
    propagate: false
    
  urllib3:
    level: WARNING
    propagate: false

# Log Destinations for Future Debugging
destinations:
  local_files:
    - logs/client_activation.log    # Main application events
    - logs/errors.log               # Error tracking and debugging
    - logs/orchestrator.log         # Workflow execution details
    - logs/sandbox_execution.log    # Code execution and validation
    - logs/performance.log          # Performance metrics and timing
    
  structured_data:
    format: json
    fields:
      - timestamp
      - logger_name
      - log_level
      - function_name
      - line_number
      - message
      - client_id
      - workflow_step
      - execution_time
      
  monitoring_integration:
    # Future: Send logs to monitoring systems
    enabled: false
    endpoints: []
    
  alert_conditions:
    # Define conditions that should trigger alerts
    error_rate_threshold: 10  # errors per minute
    performance_degradation: 50  # percent increase in execution time
    memory_usage_threshold: 80  # percent of available memory
